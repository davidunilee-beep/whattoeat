<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#285447">
  <title>오늘 뭐먹지? · 제철 식탁</title>
  <style>
    :root { color-scheme: light; --ink:#253e34; --green:#285447; --muted:#727b70; --paper:#faf9f4; --line:#e2e6db; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; word-break:keep-all; }
    button,select,input { font:inherit; }
    button,select,summary { cursor:pointer; }
    button:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid #a0b85d; outline-offset:4px; }
    .wrap { width:min(1120px, calc(100% - 48px)); margin:auto; }
    header { border-bottom:1px solid var(--line); }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:22px 0; }
    .brand { font-size:21px; font-weight:800; letter-spacing:-1px; }
    .brand span { color:#799343; margin-right:9px; }
    .month-control { display:flex; align-items:center; gap:12px; font-size:13px; }
    .header-actions { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:16px; }
    .account { display:flex; align-items:center; gap:10px; min-width:0; }
    .account-email { font-size:12px; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .account-button { border:1px solid var(--green); border-radius:9px; background:var(--green); color:white; padding:10px 16px; font-size:13px; white-space:nowrap; }
    .account-button.secondary { background:transparent; color:var(--green); }
    .account-notice { margin:0; padding:10px 0; font-size:13px; color:#95432e; }
    .dialog-actions { display:flex; align-items:center; gap:10px; }
    .favorite-star { border:1px solid #cfd8c9; border-radius:50%; width:38px; height:38px; background:white; color:var(--green); font-size:25px; line-height:1; }
    .favorite-star[aria-pressed="true"] { color:#aa751c; background:#fff5da; border-color:#e4cc91; }
    .favorite-feedback { padding:12px 20px; margin:0; background:#edf2e5; color:var(--green); font-size:13px; line-height:1.7; }
    .auth-dialog { width:min(440px, calc(100% - 32px)); }
    .auth-body { padding:26px; }
    .auth-description { color:var(--muted); font-size:13px; line-height:1.8; margin:10px 0 22px; }
    .auth-field { display:flex; flex-direction:column; gap:8px; margin:17px 0; font-size:13px; font-weight:600; }
    .auth-field input { width:100%; border:1px solid #cfd8c9; border-radius:9px; padding:12px; background:white; color:var(--ink); outline-offset:3px; }
    .auth-field input:focus-visible { outline:2px solid #a0b85d; }
    .auth-submit { width:100%; margin-top:8px; padding:13px; }
    button:disabled { cursor:wait; opacity:.6; }
    .auth-switch { display:block; margin:18px auto 0; border:0; background:transparent; color:var(--green); font-size:13px; text-decoration:underline; text-underline-offset:4px; }
    .auth-message { font-size:13px; line-height:1.8; color:#95432e; margin:16px 0 0; }
    .auth-message.success { color:var(--green); }
    @media(max-width:650px) { .topbar { align-items:flex-start; flex-wrap:wrap; gap:14px; } .header-actions { gap:10px; flex:1; } .month-control label { display:none; } .account-email { max-width:140px; } }
    select { border:1px solid #cfd8c9; border-radius:9px; background:white; color:var(--green); padding:10px 34px 10px 14px; font-weight:700; }
    .intro { padding:54px 0 32px; }
    .eyebrow { font-size:11px; letter-spacing:2.5px; color:#72834c; font-weight:800; margin:0 0 17px; }
    h1 { font-size:clamp(30px,4.5vw,48px); letter-spacing:-2px; line-height:1.3; margin:0 0 16px; font-weight:750; }
    h1 em { font-style:normal; color:#729047; }
    .intro p:last-child { color:var(--muted); font-size:15px; line-height:1.8; margin:0; }
    .ingredients-panel { padding:26px 30px 30px; border:1px solid var(--line); border-radius:18px; background:#eff2e8; }
    .panel-heading { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    h2 { margin:0; font-size:17px; letter-spacing:-.5px; }
    .small-label { color:var(--muted); font-size:12px; }
    .ingredients { display:flex; flex-wrap:wrap; gap:9px; }
    .ingredient { padding:10px 20px; border:1px solid #d8dece; border-radius:30px; color:#4e5c46; background:#fff; transition:background .15s, color .15s, transform .15s; }
    .ingredient:hover { border-color:#789363; transform:translateY(-2px); }
    .ingredient[aria-pressed="true"] { background:var(--green); color:white; border-color:var(--green); }
    .results-heading { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:38px 0 20px; }
    .results-heading h2 { font-size:22px; }
    .results-heading h2 span { color:#7e8971; font-size:14px; margin-left:8px; font-weight:500; }
    .results-heading p { font-size:12px; color:var(--muted); margin:0; }
    .extra-description { color:var(--muted); font-size:13px; line-height:1.8; margin:-8px 0 20px; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; align-items:start; }
    .card { position:relative; background:white; border:1px solid var(--line); border-radius:15px; overflow:hidden; }
    .card-open { position:absolute; inset:0; width:100%; border:0; border-radius:14px; background:transparent; }
    .card-open:focus-visible { outline-offset:-4px; }
    .card-link { display:block; border-top:1px solid #edf0e8; padding-top:13px; color:var(--green); font-size:13px; font-weight:600; }
    .photo { position:relative; aspect-ratio:1.5; background:#e9eddf; display:grid; place-items:center; overflow:hidden; }
    .photo img { width:100%; height:100%; object-fit:cover; transition:transform .35s; }
    .card:hover .photo img { transform:scale(1.035); }
    .photo .fallback { text-align:center; color:#7b886c; font-size:13px; line-height:2; }
    .fallback span { display:block; font-size:35px; }
    .category { position:absolute; top:13px; left:13px; background:#fffffff0; color:var(--green); padding:5px 10px; border-radius:6px; font-size:11px; font-weight:700; }
    .card-body { padding:21px; }
    .meta { font-size:11px; color:#7c8b67; margin:0 0 8px; }
    h3 { font-size:19px; letter-spacing:-.6px; margin:0; line-height:1.5; }
    .recipe-ingredients { color:var(--muted); font-size:12px; line-height:1.7; margin:10px 0 17px; }
    body.modal-open { overflow:hidden; }
    .recipe-dialog { width:min(760px, calc(100% - 32px)); max-height:90vh; max-height:90dvh; padding:0; border:0; border-radius:20px; background:var(--paper); color:var(--ink); overflow:auto; overscroll-behavior:contain; box-shadow:0 24px 90px #10261d55; }
    .recipe-dialog::backdrop { background:#142b23b3; }
    .dialog-toolbar { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; background:var(--paper); padding:12px 20px; border-bottom:1px solid var(--line); font-size:13px; }
    .dialog-x { width:36px; height:36px; border:1px solid var(--line); border-radius:50%; background:white; color:var(--green); font-size:24px; line-height:1; }
    .dialog-photo { aspect-ratio:16/9; }
    .dialog-photo img { object-fit:contain; }
    .dialog-body { padding:28px clamp(20px,5vw,40px) 32px; }
    .dialog-body h2 { font-size:clamp(23px,4vw,30px); line-height:1.4; margin-bottom:12px; }
    .dialog-meta { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 26px; }
    .dialog-meta span { background:#eaf0e1; border-radius:6px; padding:6px 10px; font-size:12px; }
    .dialog-body .instructions h3 { font-size:16px; margin:24px 0 8px; }
    .dialog-body .instructions { font-size:14px; }
    .recipe-tip { background:#edf2e5; border-radius:12px; padding:1px 18px 18px; margin-top:24px; }
    .dialog-close { width:100%; border:0; border-radius:10px; padding:13px; background:var(--green); color:white; font-weight:600; margin-top:28px; }
    .instructions { color:#65705e; line-height:1.8; }
    .instructions h4 { margin:18px 0 6px; color:var(--ink); }
    .instructions p { white-space:pre-line; overflow-wrap:anywhere; margin:0; }
    .instructions ol { padding-left:20px; margin:6px 0; }
    .instructions li { padding-left:3px; margin:8px 0; }
    .empty { padding:54px 20px; text-align:center; border:1px dashed #d3dcc8; border-radius:15px; color:var(--muted); line-height:1.8; }
    .empty strong { display:block; color:var(--ink); font-size:18px; margin-bottom:8px; }
    .retry { border:0; border-radius:7px; background:var(--green); color:white; padding:9px 18px; margin-top:15px; }
    footer { margin-top:60px; border-top:1px solid var(--line); padding:24px 0; font-size:11px; color:#8a9182; }
    footer .wrap { display:flex; justify-content:space-between; gap:12px; }
    [hidden] { display:none !important; }
    @media(min-width:1500px) { .intro { padding-top:70px; } }
    @media(max-width:850px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; } }
    @media(max-width:560px) { .wrap { width:calc(100% - 32px); } .brand { font-size:18px; } .month-control { gap:7px; } .month-control label { display:none; } .intro { padding-top:36px; } .intro p:last-child { font-size:13px; } .ingredients-panel { padding:22px 18px; } .panel-heading { align-items:start; flex-direction:column; gap:6px; } .ingredient { padding:9px 17px; font-size:14px; } .results-heading { align-items:start; flex-direction:column; gap:8px; margin-top:30px; } .grid { grid-template-columns:1fr; } footer .wrap { flex-direction:column; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div class="brand"><span aria-hidden="true">✳</span>오늘 뭐먹지?</div>
      <div class="header-actions">
        <div class="month-control"><label for="month">어느 달의 식탁인가요?</label><select id="month" aria-label="제철 월 선택"></select></div>
        <button id="favorites-button" type="button" class="account-button secondary" aria-pressed="false">내 즐겨찾기</button>
        <div class="account"><button id="login-button" type="button" class="account-button" aria-haspopup="dialog">로그인</button><span id="account-email" class="account-email" hidden></span><button id="logout-button" type="button" class="account-button secondary" hidden>로그아웃</button></div>
      </div>
    </div>
    <div class="wrap"><p id="account-notice" class="account-notice" role="status" hidden></p></div>
  </header>
  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">A TASTE OF THE SEASON</p>
      <h1>계절이 건네는 재료,<br>오늘의 <em>맛있는 한 끼.</em></h1>
      <p>제철 재료로 채우는 작은 식탁.<br>마음에 드는 재료를 골라 오늘의 메뉴를 만나보세요.</p>
    </section>
    <section class="ingredients-panel" aria-labelledby="ingredients-title">
      <div class="panel-heading"><h2 id="ingredients-title">이달의 제철 재료</h2><span class="small-label">재료 하나를 선택해 주세요</span></div>
      <div id="ingredients" class="ingredients" role="group" aria-label="제철 재료 선택"></div>
    </section>
    <section aria-labelledby="results-title" aria-busy="true" id="results-section">
      <div class="results-heading"><h2 id="results-title">오늘의 추천 레시피</h2><p id="result-count" role="status" aria-live="polite">레시피를 불러오는 중이에요…</p></div>
      <div id="recipes" class="grid"></div>
      <div id="message" class="empty" hidden></div>
    </section>
    <section id="extra-section" aria-labelledby="extra-title" hidden>
      <div class="results-heading"><h2 id="extra-title">새로운 맛도 만나보세요</h2><p id="extra-count"></p></div>
      <p id="extra-description" class="extra-description"></p>
      <div id="extra-recipes" class="grid"></div>
    </section>
    <section id="favorites-section" aria-labelledby="favorites-title" hidden>
      <div class="results-heading"><h2 id="favorites-title">내 즐겨찾기</h2><p id="favorites-count" role="status" aria-live="polite"></p></div>
      <div id="favorites-message" class="empty" hidden></div>
      <div id="favorites-grid" class="grid"></div>
    </section>
  </main>
  <footer><div class="wrap"><span>오늘 뭐먹지? · 제철을 담은 일상</span><span>레시피·사진 출처: 식품안전나라 / menu.json</span></div></footer>
  <dialog id="recipe-dialog" class="recipe-dialog" aria-labelledby="dialog-title">
    <div class="dialog-toolbar"><span>오늘의 레시피</span><div class="dialog-actions"><button id="favorite-star" type="button" class="favorite-star" aria-label="즐겨찾기 저장" aria-pressed="false">☆</button><button type="button" class="dialog-x" aria-label="레시피 팝업 닫기" autofocus>×</button></div></div>
    <p id="favorite-feedback" class="favorite-feedback" role="status" aria-live="polite" hidden></p>
    <div id="dialog-content"></div>
  </dialog>
  <dialog id="auth-dialog" class="recipe-dialog auth-dialog" aria-labelledby="auth-title" aria-describedby="auth-description">
    <div class="dialog-toolbar"><span>오늘 뭐먹지? 계정</span><button id="auth-close" type="button" class="dialog-x" aria-label="로그인 팝업 닫기">×</button></div>
    <div class="auth-body">
      <h2 id="auth-title">로그인</h2>
      <p id="auth-description" class="auth-description">이메일로 로그인하고 오늘의 식탁을 만나보세요.</p>
      <form id="auth-form">
        <label class="auth-field" for="auth-email">이메일<input id="auth-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254" autofocus></label>
        <label class="auth-field" for="auth-password">비밀번호<input id="auth-password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="auth-submit" class="account-button auth-submit" type="submit">로그인</button>
      </form>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></p>
      <button id="auth-switch" class="auth-switch" type="button">처음이신가요? 회원가입</button>
    </div>
  </dialog>
  <script id="recipes-script">
    'use strict';
    const monthSelect = document.querySelector('#month');
    const ingredientList = document.querySelector('#ingredients');
    const recipeGrid = document.querySelector('#recipes');
    const message = document.querySelector('#message');
    const resultCount = document.querySelector('#result-count');
    const resultsTitle = document.querySelector('#results-title');
    const resultsSection = document.querySelector('#results-section');
    const recipeDialog = document.querySelector('#recipe-dialog');
    const dialogContent = document.querySelector('#dialog-content');
    const extraSection = document.querySelector('#extra-section');
    const extraGrid = document.querySelector('#extra-recipes');
    const extraRecommendations = new Map();
    let activeRecipe = null;
    let dialogOpener = null;
    function closeRecipe() { recipeDialog.close(); }
    document.querySelector('.dialog-x').addEventListener('click', closeRecipe);
    recipeDialog.addEventListener('close', () => {
      activeRecipe = null;
      document.body.classList.toggle('modal-open', document.querySelector('#auth-dialog').open);
      dialogContent.replaceChildren();
      if (dialogOpener?.isConnected) dialogOpener.focus({ preventScroll: true });
      else if (favoritesView) favoritesButton.focus({ preventScroll: true });
      dialogOpener = null;
    });
    let data = { seasonal: [], recipes: [] };
    let selectedIngredient = null;
    for (let month = 1; month <= 12; month++) {
      monthSelect.add(new Option(`${month}월`, String(month)));
    }
    monthSelect.value = String(new Date().getMonth() + 1);

    function element(tag, className, content) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (content !== undefined) node.textContent = content;
      return node;
    }

    function showMessage(title, description) {
      message.replaceChildren(element('strong', '', title), element('span', '', description));
      message.hidden = false;
    }

    function renderIngredients() {
      const month = Number(monthSelect.value);
      const names = [...new Set(data.seasonal.filter(item => Number(item.month) === month).map(item => item.name))];
      selectedIngredient = null;
      document.querySelector('#ingredients-title').textContent = `${month}월의 제철 재료`;
      ingredientList.replaceChildren();
      for (const name of names) {
        const button = element('button', 'ingredient', name);
        button.type = 'button';
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => {
          selectedIngredient = name;
          for (const item of ingredientList.children) item.setAttribute('aria-pressed', String(item === button));
          renderRecipes();
        });
        ingredientList.append(button);
      }
      if (!names.length) ingredientList.append(element('span', 'small-label', '등록된 제철 재료가 없어요. 다른 달을 선택해 주세요.'));
      renderRecipes();
      renderExtraRecipes();
      if (favoritesView) renderFavorites();
    }

    function pickExtraRecipes(recipes, month) {
      const monthly = recipes.filter(recipe => Array.isArray(recipe.months) && recipe.months.includes(month));
      if (monthly.length > 15) return [];
      const monthlyIds = new Set(monthly.map(recipe => recipe.id));
      const unique = new Map();
      for (const recipe of recipes) {
        if (!monthlyIds.has(recipe.id)) unique.set(recipe.id, recipe);
      }
      const pool = [...unique.values()];
      // Partial Fisher–Yates shuffle: sample up to five distinct recipes uniformly.
      const count = Math.min(5, pool.length);
      for (let i = 0; i < count; i++) {
        const j = i + Math.floor(Math.random() * (pool.length - i));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, count);
    }

    function renderExtraRecipes() {
      const month = Number(monthSelect.value);
      extraSection.hidden = true;
      extraGrid.replaceChildren();
      if (!extraRecommendations.has(month)) extraRecommendations.set(month, pickExtraRecipes(data.recipes, month));
      const extras = extraRecommendations.get(month);
      if (!extras.length) return;
      const monthlyCount = data.recipes.filter(recipe => Array.isArray(recipe.months) && recipe.months.includes(month)).length;
      document.querySelector('#extra-count').textContent = `랜덤 추천 ${extras.length}개`;
      document.querySelector('#extra-description').textContent = `${month}월의 추천 메뉴가 ${monthlyCount}개여서, 전체 레시피에서 새로운 메뉴를 골랐어요. 월·재료 조건과 관계없이 추천해 드려요.`;
      const cards = document.createDocumentFragment();
      extras.forEach(recipe => cards.append(createRecipeCard(recipe, '새로운 맛 · 랜덤 추천')));
      extraGrid.append(cards);
      extraSection.hidden = favoritesView;
    }

    function createPhoto(recipe, large = false) {
      const photo = element('div', 'photo');
      if (large) photo.classList.add('dialog-photo');
      const fallback = element('div', 'fallback');
      fallback.append(element('span', '', '✳'), document.createTextNode('맛있는 한 끼를 준비해요'));
      photo.append(fallback);
      if (recipe.image) {
        const img = element('img');
        img.alt = recipe.name;
        img.loading = large ? 'eager' : 'lazy';
        img.decoding = 'async';
        img.addEventListener('error', () => { img.remove(); fallback.hidden = false; });
        img.addEventListener('load', () => { fallback.hidden = true; });
        // Only allow web image URLs from the data file.
        try {
          const url = new URL(recipe.image, location.href);
          if (['http:', 'https:'].includes(url.protocol)) {
            fallback.hidden = true;
            img.src = url.href;
            photo.append(img);
          }
        } catch { /* Keep the image placeholder. */ }
      }
      photo.append(element('span', 'category', recipe.category || '요리'));
      return photo;
    }

    function createRecipeCard(recipe, label = `${monthSelect.value}월 제철 · ${selectedIngredient}`) {
      const card = element('article', 'card');
      const photo = createPhoto(recipe);
      const body = element('div', 'card-body');
      body.append(element('p', 'meta', label), element('h3', '', recipe.name));
      body.append(element('p', 'recipe-ingredients', (recipe.main_ingredients || []).join(' · ')));
      body.append(element('span', 'card-link', '레시피 자세히 보기 ↗'));
      const open = element('button', 'card-open');
      open.type = 'button';
      open.setAttribute('aria-label', `${recipe.name} 레시피 보기`);
      open.setAttribute('aria-haspopup', 'dialog');
      open.addEventListener('click', () => openRecipe(recipe, open));
      card.append(photo, body, open);
      return card;
    }

    function openRecipe(recipe, opener) {
      activeRecipe = recipe;
      document.querySelector('#favorite-feedback').hidden = true;
      updateFavoriteStar();
      dialogOpener = opener;
      const body = element('div', 'dialog-body');
      const title = element('h2', '', recipe.name);
      title.id = 'dialog-title';
      const meta = element('div', 'dialog-meta');
      meta.append(element('span', '', `요리종류 · ${recipe.category || '미등록'}`), element('span', '', `조리방법 · ${recipe.method || '미등록'}`));
      body.append(title, meta);
      const instructions = element('div', 'instructions');
      instructions.append(element('h3', '', '재료'), element('p', '', recipe.ingredients_text || '등록된 재료 설명이 없어요.'));
      instructions.append(element('h3', '', '조리순서'));
      if (Array.isArray(recipe.steps) && recipe.steps.length) {
        const steps = element('ol');
        for (const step of recipe.steps) steps.append(element('li', '', step));
        instructions.append(steps);
      } else {
        instructions.append(element('p', '', '등록된 조리순서가 없어요.'));
      }
      if (typeof recipe.tip === 'string' && recipe.tip.trim()) {
        const tip = element('aside', 'recipe-tip');
        tip.append(element('h3', '', '💡 요리 팁'), element('p', '', recipe.tip));
        instructions.append(tip);
      }
      const close = element('button', 'dialog-close', '닫기');
      close.type = 'button';
      close.addEventListener('click', closeRecipe);
      body.append(instructions, close);
      dialogContent.replaceChildren(createPhoto(recipe, true), body);
      recipeDialog.showModal();
      document.body.classList.add('modal-open');
      recipeDialog.scrollTop = 0;
    }

    function renderRecipes() {
      const month = Number(monthSelect.value);
      recipeGrid.replaceChildren();
      message.hidden = true;
      resultsTitle.textContent = selectedIngredient ? `${selectedIngredient}로 차리는 한 끼` : '오늘의 추천 레시피';
      if (!selectedIngredient) {
        resultCount.textContent = `${month}월의 재료를 골라보세요`;
        showMessage('오늘은 어떤 재료가 끌리세요?', '위의 제철 재료를 누르면 이달에 어울리는 레시피를 보여드려요.');
        return;
      }
      const recipes = data.recipes.filter(recipe =>
        Array.isArray(recipe.seasonal) && recipe.seasonal.includes(selectedIngredient) &&
        Array.isArray(recipe.months) && recipe.months.includes(month)
      );
      resultCount.textContent = `${month}월 · ${selectedIngredient} 레시피 ${recipes.length}개`;
      if (!recipes.length) {
        showMessage('조건에 맞는 레시피가 아직 없어요', `${month}월의 다른 제철 재료를 선택해 보세요.`);
        return;
      }
      const cards = document.createDocumentFragment();
      recipes.forEach(recipe => cards.append(createRecipeCard(recipe)));
      recipeGrid.append(cards);
    }

    async function loadData() {
      resultsSection.setAttribute('aria-busy', 'true');
      monthSelect.disabled = true;
      message.hidden = true;
      resultCount.textContent = '레시피를 불러오는 중이에요…';
      try {
        const response = await fetch('./menu.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const loaded = await response.json();
        if (!Array.isArray(loaded.seasonal) || !Array.isArray(loaded.recipes)) throw new Error('Invalid menu data');
        data = loaded;
        extraRecommendations.clear();
        monthSelect.disabled = false;
        renderIngredients();
      } catch (error) {
        resultCount.textContent = '데이터를 불러오지 못했어요';
        showMessage('레시피를 불러올 수 없어요', location.protocol === 'file:'
          ? '이 페이지는 웹 서버로 열어 주세요. 같은 폴더에 menu.json 파일이 있어야 해요.'
          : '같은 폴더에 menu.json 파일이 있는지 확인하고 다시 시도해 주세요.');
        const retry = element('button', 'retry', '다시 시도');
        retry.type = 'button';
        retry.addEventListener('click', loadData);
        message.append(retry);
        console.error('메뉴 데이터 로딩 실패:', error);
      } finally {
        resultsSection.setAttribute('aria-busy', 'false');
      }
    }
    // Favorites use the authenticated user's session. Pending requests from an
    // earlier account are ignored, and writes never optimistically mark a save.
    let favoritesClient = null;
    let favoritesUser = null;
    let favoriteIds = new Set();
    let favoritesView = false;
    let favoritesLoading = false;
    let favoritesLoaded = false;
    let favoritesError = '';
    let favoritesEpoch = 0;
    let favoritesRequest = 0;
    let favoriteWrite = null;
    const favoriteStar = document.querySelector('#favorite-star');
    const favoriteFeedback = document.querySelector('#favorite-feedback');
    const favoritesSection = document.querySelector('#favorites-section');
    const favoritesButton = document.querySelector('#favorites-button');

    function favoriteNotice(text) {
      favoriteFeedback.textContent = text;
      favoriteFeedback.hidden = !text;
    }

    function updateFavoriteStar() {
      const saved = Boolean(activeRecipe && favoriteIds.has(Number(activeRecipe.id)));
      favoriteStar.textContent = saved ? '★' : '☆';
      favoriteStar.setAttribute('aria-pressed', String(saved));
      favoriteStar.setAttribute('aria-label', saved ? '즐겨찾기 삭제' : '즐겨찾기 저장');
      favoriteStar.disabled = Boolean(favoritesUser && (favoritesLoading || favoriteWrite));
    }

    function favoritesAuthChanged(user) {
      if (favoritesUser?.id === user?.id) return;
      favoritesEpoch++;
      favoritesRequest++;
      favoritesUser = user;
      favoriteIds = new Set();
      favoritesLoaded = false;
      favoritesLoading = false;
      favoritesError = '';
      favoriteWrite = null;
      if (recipeDialog.open) favoriteNotice(user ? '' : '로그인하면 즐겨찾기를 저장할 수 있어요');
      updateFavoriteStar();
      renderFavorites();
      if (user && favoritesClient) void loadFavorites();
    }

    async function loadFavorites() {
      if (!favoritesClient || !favoritesUser) return;
      const epoch = favoritesEpoch;
      const request = ++favoritesRequest;
      const userId = favoritesUser.id;
      favoritesLoading = true;
      favoritesError = '';
      updateFavoriteStar();
      renderFavorites();
      try {
        const { data: rows, error } = await favoritesClient.from('favorites')
          .select('recipe_id').eq('user_id', userId).order('created_at', { ascending: false }).limit(1000);
        if (epoch !== favoritesEpoch || request !== favoritesRequest) return;
        if (error) throw error;
        favoriteIds = new Set((rows || []).map(row => Number(row.recipe_id)));
        favoritesLoaded = true;
      } catch {
        if (epoch !== favoritesEpoch || request !== favoritesRequest) return;
        favoritesLoaded = false;
        favoritesError = '즐겨찾기를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
        if (recipeDialog.open) favoriteNotice(favoritesError);
      } finally {
        if (epoch === favoritesEpoch && request === favoritesRequest) {
          favoritesLoading = false;
          updateFavoriteStar();
          renderFavorites();
        }
      }
    }

    function setFavoritesView(show) {
      favoritesView = show;
      favoritesSection.hidden = !show;
      resultsSection.hidden = show;
      document.querySelector('.ingredients-panel').hidden = show;
      favoritesButton.textContent = show ? '레시피로 돌아가기' : '내 즐겨찾기';
      favoritesButton.setAttribute('aria-pressed', String(show));
      if (show) { extraSection.hidden = true; renderFavorites(); }
      else renderExtraRecipes();
    }

    function renderFavorites() {
      if (!favoritesView) return;
      const grid = document.querySelector('#favorites-grid');
      const notice = document.querySelector('#favorites-message');
      const count = document.querySelector('#favorites-count');
      grid.replaceChildren();
      notice.replaceChildren();
      notice.hidden = true;
      favoritesSection.setAttribute('aria-busy', String(favoritesLoading));
      count.textContent = '';
      const showNotice = text => { notice.textContent = text; notice.hidden = false; };
      if (!favoritesUser) { showNotice('로그인하면 즐겨찾기를 저장할 수 있어요'); return; }
      if (favoritesLoading) { showNotice('저장한 레시피를 불러오는 중이에요…'); return; }
      if (favoritesError) {
        showNotice(favoritesError);
        const retry = element('button', 'retry', '다시 시도');
        retry.type = 'button';
        retry.addEventListener('click', () => { if (!favoriteWrite) void loadFavorites(); });
        notice.append(retry);
        return;
      }
      if (!favoritesLoaded) { showNotice('즐겨찾기를 준비 중이에요…'); return; }
      const recipes = data.recipes.filter(recipe => favoriteIds.has(Number(recipe.id)));
      count.textContent = `저장한 레시피 ${recipes.length}개`;
      if (!recipes.length) { showNotice('저장한 레시피가 없어요. 레시피 상세 화면에서 ☆을 눌러 보세요.'); return; }
      const cards = document.createDocumentFragment();
      recipes.forEach(recipe => cards.append(createRecipeCard(recipe, '내가 저장한 레시피')));
      grid.append(cards);
    }

    async function toggleFavorite() {
      if (!activeRecipe) return;
      if (!favoritesUser) { favoriteNotice('로그인하면 즐겨찾기를 저장할 수 있어요'); return; }
      if (!favoritesClient || favoritesLoading || favoriteWrite) return;
      if (!favoritesLoaded) { await loadFavorites(); return; }
      const recipeId = Number(activeRecipe.id);
      const userId = favoritesUser.id;
      const epoch = favoritesEpoch;
      const removing = favoriteIds.has(recipeId);
      const operation = {};
      favoriteWrite = operation;
      favoritesRequest++;
      updateFavoriteStar();
      favoriteNotice('');
      try {
        const result = removing
          ? await favoritesClient.from('favorites').delete().eq('user_id', userId).eq('recipe_id', recipeId).select('recipe_id')
          : await favoritesClient.from('favorites').insert({ user_id: userId, recipe_id: recipeId }).select('recipe_id').single();
        if (epoch !== favoritesEpoch) return;
        if (result.error && !(result.error.code === '23505' && !removing)) throw result.error;
        if (!removing && !result.error && Number(result.data?.recipe_id) !== recipeId) throw new Error('Save unconfirmed');
        if (removing) favoriteIds.delete(recipeId);
        else favoriteIds.add(recipeId);
        if (Number(activeRecipe?.id) === recipeId) favoriteNotice(removing ? '즐겨찾기에서 삭제했어요.' : '즐겨찾기에 저장했어요.');
        renderFavorites();
      } catch {
        if (epoch === favoritesEpoch && Number(activeRecipe?.id) === recipeId) favoriteNotice('즐겨찾기를 변경하지 못했어요. 잠시 후 다시 시도해 주세요.');
      } finally {
        if (favoriteWrite === operation) { favoriteWrite = null; updateFavoriteStar(); }
      }
    }

    favoriteStar.addEventListener('click', toggleFavorite);
    favoritesButton.addEventListener('click', () => {
      setFavoritesView(!favoritesView);
      if (favoritesView && favoritesUser && !favoriteWrite && !favoritesLoading) void loadFavorites();
    });
    monthSelect.addEventListener('change', () => { setFavoritesView(false); renderIngredients(); });
    loadData();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script id="auth-script">
    'use strict';
    // Supabase Dashboard > Connect: use only the public project URL and
    // publishable (or legacy anon) key here. Never use secret/service_role keys.
    const SUPABASE_URL = 'https://guigwxkzotykgbbcbzjx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_RSNtY7alkYZe1wFFD49Tmw_SsbB7d63';

    const authDialog = document.querySelector('#auth-dialog');
    const authForm = document.querySelector('#auth-form');
    const authEmail = document.querySelector('#auth-email');
    const authPassword = document.querySelector('#auth-password');
    const authSubmit = document.querySelector('#auth-submit');
    const authSwitch = document.querySelector('#auth-switch');
    const authMessage = document.querySelector('#auth-message');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const accountEmail = document.querySelector('#account-email');
    const accountNotice = document.querySelector('#account-notice');
    let authClient = null;
    let authMode = 'login';
    let authBusy = false;
    let authReady = false;

    function showAuthMessage(text, success = false) {
      authMessage.textContent = text;
      authMessage.classList.toggle('success', success);
      authMessage.hidden = !text;
    }

    function setAuthBusy(busy) {
      authBusy = busy;
      authSubmit.disabled = busy || !authReady;
      authSwitch.disabled = busy;
      authEmail.disabled = busy;
      authPassword.disabled = busy;
      authForm.setAttribute('aria-busy', String(busy));
      authSubmit.textContent = busy ? '처리 중…' : authMode === 'login' ? '로그인' : '회원가입';
    }

    function setAuthMode(mode) {
      authMode = mode;
      const signup = mode === 'signup';
      document.querySelector('#auth-title').textContent = signup ? '회원가입' : '로그인';
      document.querySelector('#auth-description').textContent = signup ? '이메일과 비밀번호로 계정을 만들어 주세요.' : '이메일로 로그인하고 오늘의 식탁을 만나보세요.';
      authPassword.autocomplete = signup ? 'new-password' : 'current-password';
      authPassword.minLength = signup ? 6 : 1;
      authPassword.value = '';
      authSwitch.textContent = signup ? '이미 계정이 있나요? 로그인' : '처음이신가요? 회원가입';
      showAuthMessage(authReady ? '' : '로그인 서비스를 준비 중이에요. 잠시 후 다시 이용해 주세요.');
      setAuthBusy(false);
    }

    function renderAuthUser(user) {
      loginButton.hidden = Boolean(user);
      accountEmail.hidden = !user;
      logoutButton.hidden = !user;
      accountEmail.textContent = user?.email || '';
      accountEmail.title = user?.email || '';
      if (user && authDialog.open) authDialog.close();
      // Avoid making Supabase requests inside its synchronous auth callback.
      if (typeof favoritesAuthChanged === 'function') setTimeout(() => favoritesAuthChanged(user), 0);
    }

    function friendlyAuthError(error) {
      const code = error?.code;
      if (code === 'invalid_credentials') return '이메일 또는 비밀번호를 확인해 주세요.';
      if (code === 'email_not_confirmed') return '이메일의 인증 링크를 먼저 눌러 주세요.';
      if (code === 'user_already_exists') return '이미 가입된 이메일이에요. 로그인으로 전환해 주세요.';
      if (code === 'weak_password') return '비밀번호가 보안 기준에 맞지 않아요. 더 긴 비밀번호와 숫자·기호를 사용해 주세요.';
      if (code === 'signup_disabled') return '현재 신규 회원가입을 받지 않고 있어요.';
      if (code === 'email_address_invalid' || code === 'validation_failed') return '이메일 형식과 입력 내용을 확인해 주세요.';
      if (error?.status === 429 || code?.includes('rate_limit')) return '요청이 많아요. 잠시 후 다시 시도해 주세요.';
      return '요청을 완료하지 못했어요. 연결 상태를 확인하고 다시 시도해 주세요.';
    }

    loginButton.addEventListener('click', () => {
      accountNotice.hidden = true;
      if (!authBusy) setAuthMode('login');
      authDialog.showModal();
      document.body.classList.add('modal-open');
      if (!authReady) showAuthMessage(authClient ? '로그인 상태를 확인하고 있어요. 잠시 후 다시 시도해 주세요.' : '로그인 서비스를 준비 중이에요. 잠시 후 다시 이용해 주세요.');
    });
    document.querySelector('#auth-close').addEventListener('click', () => authDialog.close());
    authDialog.addEventListener('close', () => {
      authPassword.value = '';
      document.body.classList.toggle('modal-open', document.querySelector('#recipe-dialog').open);
      if (!loginButton.hidden) loginButton.focus({ preventScroll: true });
    });
    authSwitch.addEventListener('click', () => {
      if (!authBusy) setAuthMode(authMode === 'login' ? 'signup' : 'login');
    });

    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      if (authBusy || !authForm.reportValidity()) return;
      if (!authClient || !authReady) {
        showAuthMessage('로그인 서비스를 준비 중이에요. 잠시 후 다시 이용해 주세요.');
        return;
      }
      const mode = authMode;
      const credentials = { email: authEmail.value.trim(), password: authPassword.value };
      showAuthMessage('');
      setAuthBusy(true);
      try {
        const { data, error } = mode === 'signup'
          ? await authClient.auth.signUp(credentials)
          : await authClient.auth.signInWithPassword(credentials);
        if (error) throw error;
        authPassword.value = '';
        if (data.session?.user) {
          renderAuthUser(data.session.user);
        } else if (mode === 'signup') {
          showAuthMessage('이메일을 확인해 주세요. 가입 안내 메일의 인증 링크를 누른 뒤 로그인할 수 있어요.', true);
        } else {
          showAuthMessage('로그인 상태를 확인하지 못했어요. 다시 시도해 주세요.');
        }
      } catch (error) {
        showAuthMessage(friendlyAuthError(error));
      } finally {
        credentials.password = '';
        setAuthBusy(false);
      }
    });

    logoutButton.addEventListener('click', async () => {
      if (!authClient || logoutButton.disabled) return;
      logoutButton.disabled = true;
      accountNotice.hidden = true;
      try {
        const { error } = await authClient.auth.signOut({ scope: 'local' });
        if (error) throw error;
        renderAuthUser(null);
      } catch {
        accountNotice.textContent = '로그아웃하지 못했어요. 잠시 후 다시 시도해 주세요.';
        accountNotice.hidden = false;
      } finally {
        logoutButton.disabled = false;
      }
    });

    async function initializeAuth() {
      setAuthBusy(false);
      if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY || !window.supabase?.createClient) return;
      loginButton.disabled = true;
      let stateReceived = false;
      try {
        authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        if (typeof favoritesClient !== 'undefined') favoritesClient = authClient;
        authClient.auth.onAuthStateChange((_event, session) => {
          stateReceived = true;
          renderAuthUser(session?.user || null);
        });
        const { data, error } = await authClient.auth.getSession();
        if (error) throw error;
        if (!stateReceived) renderAuthUser(data.session?.user || null);
        authReady = true;
      } catch {
        authReady = false;
      } finally {
        loginButton.disabled = false;
        setAuthBusy(false);
      }
    }
    initializeAuth();
  </script>
